name: Render Backend Auto Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing required GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          response="$(curl -sS -w '\n%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")"
          body="$(printf '%s' "$response" | sed '$d')"
          code="$(printf '%s' "$response" | tail -n1)"

          echo "Render response code: $code"
          echo "Render response body: $body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Render deploy hook failed."
            exit 1
          fi
