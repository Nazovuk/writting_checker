services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    depends_on:
      - languagetool
      - libretranslate

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend

  languagetool:
    image: silviof/docker-languagetool:latest
    ports:
      - "8010:8010"

  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5001:5000"
